<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 208" width="100%" height="100%">
  <g id="estrella-brillante" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Central soft circular glow -->
    <circle cx="104" cy="104" r="38" fill="#FDF4C8" opacity="0.6" />

    <!-- Dotted Circle ring -->
    <circle cx="104" cy="104" r="58" fill="none" stroke="#C89B31" stroke-width="2.5" stroke-dasharray="2 6" />

    <!-- Outer Radial Spark/Ray Lines (8 dashes) -->
    <!-- Top & Bottom -->
    <line x1="104" y1="18" x2="104" y2="28" stroke="#C89B31" stroke-width="3" />
    <line x1="104" y1="180" x2="104" y2="190" stroke="#C89B31" stroke-width="3" />
    <!-- Left & Right -->
    <line x1="18" y1="104" x2="28" y2="104" stroke="#C89B31" stroke-width="3" />
    <line x1="180" y1="104" x2="190" y2="104" stroke="#C89B31" stroke-width="3" />
    <!-- Diagonals -->
    <line x1="43" y1="43" x2="50" y2="50" stroke="#C89B31" stroke-width="3" />
    <line x1="165" y1="43" x2="158" y2="50" stroke="#C89B31" stroke-width="3" />
    <line x1="43" y1="165" x2="50" y2="158" stroke="#C89B31" stroke-width="3" />
    <line x1="165" y1="165" x2="158" y2="158" stroke="#C89B31" stroke-width="3" />

    <!-- Main Star -->
    <!-- Star Points: Center at (104,104), Outer R~65, Inner R~28 -->
    <polygon points="104,36 118,78 163,78 126,104 140,147 104,120 68,147 82,104 45,78 90,78" 
             fill="#FAF0D7" stroke="#5D4573" stroke-width="3.5" />

  </g>
</svg>