<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 208" width="100%" height="100%">
  <g id="star">
    <!-- Star fill -->
    <polygon points="104,32 115.5,60 146,62 122.5,82 130,112 104,95 78,112 85.5,82 62,62 92.5,60" 
             fill="#FAF0D7" stroke="#C99E32" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  
  <g id="left-wavy-lines">
    <path d="M 62,93 C 40,105 44,125 43,145 C 42,158 35,163 32,168" 
          fill="none" stroke="#A8C3A8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 62,93 C 40,105 44,125 43,145 C 42,158 35,163 32,168" 
          fill="none" stroke="#5B7E5D" stroke-width="3" stroke-linecap="round"/>
  </g>

