          fill="none" stroke="#4A3B4E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Gold wave line -->
    <path d="M 70,168 C 85,155 105,145 116,146 C 122,147 110,170 125,170" 
          fill="none" stroke="#C99E32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
