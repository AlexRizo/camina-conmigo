    <path d="M 152,88 C 165,100 162,125 163,145 C 164,152 173,158 175,162" 
          fill="none" stroke="#46664A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="dunes-and-waves">
    <!-- Base dune fill -->
    <path d="M 28,179 C 28,179 40,160 80,148 C 100,142 110,155 120,171 C 122,175 125,178 130,178 C 150,178 170,165 180,156 L 180,180 L 28,180 Z" 
